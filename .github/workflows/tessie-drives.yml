name: Tessie Monthly Drives

on:
  workflow_dispatch: # manual only

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull per-drive history from Tessie
        env:
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          CYBERTRUCK_VIN: ${{ secrets.CYBERTRUCK_VIN }}
        run: |
          python - <<'EOF2'
          import json, os, urllib.request
          from datetime import datetime, timezone

          token = os.environ["TESSIE_API_TOKEN"]
          vin = os.environ["CYBERTRUCK_VIN"]
          url = f"https://api.tessie.com/{vin}/drives"
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.load(r)
          results = data.get("results", [])
          print(f"drive records: {len(results)}")

          by_month = {}
          drives_out = []
          for dd in results:
              miles = dd.get("odometer_distance")
              if miles is None:
                  continue
              miles = float(miles)
              ts = dd.get("started_at")
              if ts is None:
                  continue
              iso = datetime.fromtimestamp(int(ts), tz=timezone.utc).isoformat()
              ym = iso[:7]
              b = by_month.setdefault(ym, {"miles": 0.0, "drives": 0})
              b["miles"] += miles
              b["drives"] += 1
              drives_out.append({
                  "start": iso,
                  "miles": round(miles, 2),
                  "tag": dd.get("tag") or "",
                  "start_loc": dd.get("starting_location") or "",
                  "end_loc": dd.get("ending_location") or "",
              })

          months = [{"month": ym, "miles": round(v["miles"], 1), "drives": v["drives"]} for ym, v in sorted(by_month.items())]
          with open("tessie-drives.json", "w") as f:
              json.dump({"generated_at": datetime.now(timezone.utc).isoformat(), "months": months, "drives": drives_out}, f, indent=1)
          print("done")
          EOF2

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: tessie-drives
          path: tessie-drives.json
