name: Turo Economics Pull

on:
  workflow_dispatch: # manual only

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Pull bank transactions from SimpleFIN
        env:
          SIMPLEFIN_ACCESS_URL: ${{ secrets.SIMPLEFIN_ACCESS_URL }}
        run: python scripts/pull_econ.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: turo-econ
          path: turo-econ.json
