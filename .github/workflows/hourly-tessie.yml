name: Hourly Sync - Tessie Only

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync-tessie:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests supabase
      
      - name: Sync Tessie data
        env:
          TESSIE_API_TOKEN: ${{ secrets.TESSIE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CYBERTRUCK_VIN: ${{ secrets.CYBERTRUCK_VIN }}
        run: |
          # Test Supabase connectivity first
          python -c "
          import socket, sys, os
          url = os.environ.get('SUPABASE_URL', '').replace('https://','').replace('http://','').rstrip('/')
          host = url.split('/')[0]
          try:
              socket.gethostbyname(host)
              print(f'Supabase host {host} resolves OK')
          except socket.gaierror:
              print(f'::error::Supabase host {host} does not resolve (NXDOMAIN). Project may be paused or deleted.')
              print('::warning::Skipping Tessie sync — database unavailable. See https://supabase.com/dashboard')
              sys.exit(0)  # Don't fail the workflow; just skip gracefully
          "
          # If Supabase is unreachable, exit 0 (skip) rather than fail
          python -c "import socket,os; host=os.environ.get('SUPABASE_URL','').replace('https://','').split('/')[0]; socket.gethostbyname(host)" 2>/dev/null && python scripts/sync_tessie.py || echo "::warning::Tessie sync skipped — Supabase unavailable"
